<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FootixMap : trouver un match de foot près de chez soi</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header id="header">
    <h1>FootixMap</h1>
    <p>Matchs et résultats de Ligue 1 à National 2, saison 2025-2026</p>
  </header>

  <div id="controls">
    <label>Du <input type="date" id="dateDebut"></label>
    <label>au <input type="date" id="dateFin"></label>
    <label>Région <select id="region"><option value="">Toutes</option></select></label>
    <label>Division <select id="categorie"><option value="">Toutes</option></select></label>
    <label>Domicile <select id="homeTeam"><option value="">Toutes</option></select></label>
    <label>Extérieur <select id="awayTeam"><option value="">Toutes</option></select></label>
    <button id="btnFiltrer">Filtrer</button>
    <button id="btnReset">Réinitialiser</button>
    <button id="btnHasard">Match au hasard</button>
    <button id="btnExport">Exporter en CSV</button>

    <div id="ligneTampon">
      <label class="adresse">Adresse
        <input type="text" id="adresseTampon" placeholder="ex. place de la Comédie, Montpellier" autocomplete="off">
        <div id="adresse-suggestions"></div>
      </label>
      <button id="btnCarte">ou cliquer sur la carte</button>
      <label>Rayon <input type="number" id="rayonKm" min="1" step="1" value="30"> km</label>
      <button id="btnTampon">Matchs dans le rayon</button>
      <button id="btnEffacerTampon">Effacer le rayon</button>
    </div>
  </div>

  <main id="mainContainer">
    <div id="mymap"></div>

    <aside id="statsContainer">
      <h2>Statistiques</h2>
      <p class="aide">Calculées sur les matchs affichés.</p>
      <div id="statsFilters">
        <label>Équipe <select id="statsTeam"><option value="">Toutes</option></select></label>
        <label>Région <select id="statsRegion"><option value="">Toutes</option></select></label>
        <label>Division <select id="statsCategorie"><option value="">Toutes</option></select></label>
      </div>
      <div id="statsContent">
        <p>Matchs : <span id="nbMatchs">0</span></p>
        <p>Stades : <span id="nbStades">0</span></p>
        <p>Buts : <span id="nbButs">0</span></p>
        <p id="ligneBilan">Bilan : <span id="bilan">-</span></p>
      </div>
      <div id="graphique"><canvas id="statsChart"></canvas></div>
    </aside>
  </main>

  <div id="distance-info">Chargement des données...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
